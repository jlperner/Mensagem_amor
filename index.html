<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a0a" />
  <title>Para Você ❤️</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Tela de entrada */
    #entrada {
      position: fixed;
      inset: 0;
      background: #0a0a0a;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      transition: opacity 0.8s ease;
    }

    #entrada.saindo {
      opacity: 0;
      pointer-events: none;
    }

    .entrada-coracao {
      font-size: 3.5rem;
      animation: heartbeat 1.8s ease-in-out infinite;
    }

    .entrada-texto {
      text-align: center;
      font-size: 1.1rem;
      color: rgba(245, 230, 211, 0.6);
      letter-spacing: 0.08em;
      line-height: 1.8;
    }

    .entrada-btn {
      background: none;
      border: 1.5px solid rgba(220, 120, 120, 0.6);
      color: #f5e6d3;
      font-family: 'Georgia', serif;
      font-size: 1.05rem;
      padding: 0.9rem 2.5rem;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.3s ease;
      animation: pulse-border 2s ease-in-out infinite;
    }

    .entrada-btn:hover {
      background: rgba(220, 120, 120, 0.15);
      border-color: #dc7878;
    }

    body {
      min-height: 100vh;
      background: #0a0a0a;
      color: #f5e6d3;
      font-family: 'Georgia', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 2rem 1.5rem 4rem;
      overflow-x: hidden;
    }

    .particles {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      background: rgba(220, 120, 120, 0.4);
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 1; }
      100% { transform: translateY(-10vh) translateX(30px); opacity: 0; }
    }

    .content {
      position: relative;
      z-index: 1;
      max-width: 600px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .heart-title {
      font-size: 2.8rem;
      text-align: center;
      animation: heartbeat 1.8s ease-in-out infinite;
      user-select: none;
      margin-top: 1rem;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.15); }
      28%       { transform: scale(1); }
      42%       { transform: scale(1.1); }
      56%       { transform: scale(1); }
    }

    .subtitle {
      text-align: center;
      font-size: 0.95rem;
      color: rgba(245, 230, 211, 0.45);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* Botões de escolha */
    .choice-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .choice-btn {
      background: none;
      border: 1px solid rgba(220, 120, 120, 0.35);
      color: rgba(245, 230, 211, 0.7);
      font-family: 'Georgia', serif;
      font-size: 0.95rem;
      padding: 0.6rem 1.5rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.03em;
    }

    .choice-btn:hover {
      border-color: rgba(220, 120, 120, 0.8);
      color: #f5e6d3;
    }

    .choice-btn.active {
      border-color: #dc7878;
      color: #f5e6d3;
      background: rgba(220, 120, 120, 0.15);
    }

    /* Botão de música */
    .btn-rapidinhas {
      background: linear-gradient(135deg, rgba(180,80,80,0.25), rgba(100,60,100,0.3));
      border: 1.5px solid rgba(220, 120, 120, 0.7);
      color: #f5e6d3;
      font-family: 'Georgia', serif;
      font-size: 1.05rem;
      padding: 0.8rem 2rem;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s ease;
      letter-spacing: 0.05em;
      box-shadow: 0 0 18px rgba(220, 120, 120, 0.15);
    }

    .btn-rapidinhas:hover {
      background: linear-gradient(135deg, rgba(180,80,80,0.4), rgba(100,60,100,0.45));
      box-shadow: 0 0 25px rgba(220, 120, 120, 0.3);
      transform: scale(1.03);
    }

    .btn-rapidinhas.active {
      border-color: #dc7878;
      box-shadow: 0 0 30px rgba(220, 120, 120, 0.4);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #dc7878;
      color: white;
      font-family: sans-serif;
      font-size: 0.7rem;
      font-weight: bold;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      margin-left: 0.5rem;
      vertical-align: middle;
      animation: pulse-badge 1.5s ease-in-out infinite;
    }

    @keyframes pulse-badge {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.2); }
    }

    #music-btn {
      display: none;
      background: none;
      border: 2px solid rgba(220, 120, 120, 0.6);
      color: #f5e6d3;
      font-family: 'Georgia', serif;
      font-size: 1.1rem;
      padding: 1rem 2.2rem;
      border-radius: 50px;
      cursor: pointer;
      align-items: center;
      gap: 0.7rem;
      transition: all 0.3s ease;
    }

    #music-btn:hover { background: rgba(220, 120, 120, 0.15); }

    #music-btn.playing {
      background: rgba(220, 120, 120, 0.2);
      border-color: #dc7878;
      animation: pulse-border 2s ease-in-out infinite;
    }

    @keyframes pulse-border {
      0%, 100% { box-shadow: 0 0 0 0 rgba(220, 120, 120, 0.3); }
      50%       { box-shadow: 0 0 0 8px rgba(220, 120, 120, 0); }
    }

    .btn-icon { font-size: 1.3rem; }

    #music-erro {
      display: none;
      font-size: 0.8rem;
      color: rgba(220, 120, 120, 0.7);
      text-align: center;
    }

    #music-btn.playing .btn-icon {
      animation: spin-slow 3s linear infinite;
    }

    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* Carta de texto/imagem */
    .letter {
      display: none;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(220, 120, 120, 0.15);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      line-height: 1.9;
      font-size: 1.05rem;
      text-align: left;
      color: #e8d5c0;
      backdrop-filter: blur(4px);
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      width: 100%;
    }

    .letter.visible { opacity: 1; transform: translateY(0); }
    .letter p { margin-bottom: 1.2rem; }
    .letter p:last-child { margin-bottom: 0; }

    .carta-img {
      width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 12px;
      opacity: 0.92;
    }


    /* ── Pensamentos ── */
    .pensamentos-box {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      width: 100%;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.8s ease, transform 0.8s ease;
    }

    .pensamentos-box.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .pensamento-card {
      width: 100%;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(180,80,80,0.08), rgba(100,60,100,0.12));
      border: 1px solid rgba(220, 120, 120, 0.2);
      position: relative;
      overflow: hidden;
    }

    .pensamento-card::before {
      content: '"';
      position: absolute;
      top: -10px;
      left: 16px;
      font-size: 8rem;
      color: rgba(220, 120, 120, 0.08);
      font-family: Georgia, serif;
      line-height: 1;
      pointer-events: none;
    }

    .pensamento-texto {
      font-size: 1.25rem;
      line-height: 1.75;
      text-align: center;
      color: #f0ddd0;
      font-style: italic;
      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .pensamento-texto.saindo { opacity: 0; }

    .pensamento-conteudo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2rem;
      width: 100%;
      transition: opacity 0.4s ease;
    }

    .pensamento-conteudo.saindo { opacity: 0; }

    .pensamento-img {
      max-width: 100%;
      max-height: 60vh;
      object-fit: contain;
      border-radius: 12px;
      opacity: 0.92;
    }

    .pensamento-nav {
      display: flex;
      align-items: center;
      gap: 2rem;
    }

    .nav-btn {
      background: none;
      border: 1px solid rgba(220, 120, 120, 0.3);
      color: rgba(245, 230, 211, 0.6);
      font-size: 1.3rem;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:hover {
      border-color: #dc7878;
      color: #f5e6d3;
      background: rgba(220, 120, 120, 0.1);
    }

    .nav-btn:disabled {
      opacity: 0.2;
      cursor: default;
    }

    .pensamento-data {
      position: absolute;
      bottom: 0.8rem;
      right: 1.2rem;
      font-size: 0.75rem;
      color: rgba(220, 120, 120, 0.5);
      font-style: italic;
      letter-spacing: 0.05em;
    }

    .pensamento-counter {
      font-size: 0.85rem;
      color: rgba(245, 230, 211, 0.35);
      letter-spacing: 0.1em;
      min-width: 50px;
      text-align: center;
    }
  </style>
</head>
<body>

  <!-- Tela de entrada -->
  <div id="entrada">
    <div class="entrada-coracao">❤️</div>
    <p class="entrada-texto">Tem uma mensagem<br>esperando por você</p>
    <button class="entrada-btn" onclick="entrar()">Abrir ❤️</button>
  </div>

  <div class="particles" id="particles"></div>

  <div class="content">
    <div class="heart-title">❤️</div>
    <p class="subtitle">Para você</p>

    <div id="btn-rapidinhas-wrap"></div>
    <div class="choice-btns" id="choice-btns"></div>

    <button id="music-btn" onclick="toggleMusic()">
      <span class="btn-icon">🎵</span>
      <span id="btn-text">Pausar</span>
    </button>
    <p id="music-erro">Não consegui carregar a música 🎵</p>

    <div class="letter" id="letter"></div>

    <div class="pensamentos-box" id="pensamentos-box">
      <div class="pensamento-card">
        <div class="pensamento-conteudo" id="pensamento-conteudo">
          <img class="pensamento-img" id="pensamento-img" alt="" hidden />
          <p class="pensamento-texto" id="pensamento-texto"></p>
        </div>
        <span class="pensamento-data" id="pensamento-data"></span>
      </div>
      <div class="pensamento-nav">
        <button class="nav-btn" id="btn-prev" onclick="navegarPensamento(-1)">←</button>
        <span class="pensamento-counter" id="pensamento-counter"></span>
        <button class="nav-btn" id="btn-next" onclick="navegarPensamento(1)">→</button>
      </div>
    </div>
  </div>

  <script type="module">
  // =======================================================
  // O conteúdo (cartas, rapidinhas e playlist) fica em
  // conteudo.json. Use a página admin.html para adicionar
  // coisas novas sem mexer em código.
  // =======================================================

  let dados;
  try {
    const resp = await fetch('conteudo.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error(resp.status);
    dados = await resp.json();
  } catch (e) {
    document.querySelector('.entrada-texto').innerHTML =
      'Não consegui carregar o conteúdo.<br>Abra a página por um servidor (http), não por arquivo.';
    document.querySelector('.entrada-btn').style.display = 'none';
    throw e;
  }

  const CARTAS      = dados.cartas || [];
  const PENSAMENTOS = { textos: dados.pensamentos || [] };
  const PLAYLIST    = dados.playlist || [];


    const musicBtn    = document.getElementById('music-btn');
    const btnText     = document.getElementById('btn-text');
    const letter      = document.getElementById('letter');
    const choiceBtns  = document.getElementById('choice-btns');
    const pensBox     = document.getElementById('pensamentos-box');
    const pensTexto   = document.getElementById('pensamento-texto');
    const pensImg     = document.getElementById('pensamento-img');
    const pensConteudo = document.getElementById('pensamento-conteudo');
    const pensData    = document.getElementById('pensamento-data');
    const pensCounter = document.getElementById('pensamento-counter');

    const musicErro = document.getElementById('music-erro');

    // Cria um áudio sem baixar nada até tocar; mostra aviso se o arquivo falhar
    function criarAudio(src, loop = false) {
      const a = new Audio();
      a.preload = 'none';
      a.loop = loop;
      a.src = src;
      a.addEventListener('error', () => {
        musicErro.style.display = 'block';
        musicBtn.classList.remove('playing');
        btnText.textContent = 'Tocar';
      });
      return a;
    }

    const audioIntro = criarAudio("Billy Paul - Me and Mrs. Jones Official Audio.mp3", true);

    function entrar() {
      const entrada = document.getElementById('entrada');
      entrada.classList.add('saindo');
      setTimeout(() => entrada.style.display = 'none', 800);
      audioIntro.play().catch(() => {});
    }

    function pararIntro() {
      audioIntro.pause();
      audioIntro.currentTime = 0;
    }

    // Ordena do mais recente para o mais antigo
    PENSAMENTOS.textos.sort((a, b) => new Date(b.data) - new Date(a.data));

    // Detecta datas duplicadas para decidir se mostra hora
    const todasDatas = PENSAMENTOS.textos.map(t => new Date(t.data).toDateString());
    const datasComHora = new Set(todasDatas.filter((d, i) => todasDatas.indexOf(d) !== i));

    function formatarData(dataStr) {
      const d = new Date(dataStr);
      const meses = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
      const base = `${d.getDate()} ${meses[d.getMonth()]} ${d.getFullYear()}`;
      if (datasComHora.has(d.toDateString())) {
        const h = String(d.getHours()).padStart(2,'0');
        const m = String(d.getMinutes()).padStart(2,'0');
        return `${base} · ${h}:${m}`;
      }
      return base;
    }
    const btnPrev     = document.getElementById('btn-prev');
    const btnNext     = document.getElementById('btn-next');

    const audios = CARTAS.map(c => criarAudio(c.musica, true));

    // Playlist embaralhada para pensamentos
    function embaralhar(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    let playlistAtual = embaralhar(PLAYLIST);
    let playlistIndex = 0;
    let audioP = null;

    function tocarDaPlaylist(index) {
      if (audioP) audioP.pause();
      playlistIndex = index;
      audioP = criarAudio(playlistAtual[playlistIndex]);
      audioP.addEventListener('ended', proximaMusica);
      return audioP.play();
    }

    function proximaMusica() {
      const proximo = (playlistIndex + 1) % playlistAtual.length;
      if (proximo === 0) playlistAtual = embaralhar(PLAYLIST);
      tocarDaPlaylist(proximo).catch(() => {});
    }

    let currentIndex = -1;
    let currentMode  = '';
    let pensIndex    = 0;

    // Partículas
    const container = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      p.style.left = Math.random() * 100 + '%';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (Math.random() * 15) + 's';
      const size = (2 + Math.random() * 4) + 'px';
      p.style.width = p.style.height = size;
      p.style.opacity = (0.2 + Math.random() * 0.5).toString();
      container.appendChild(p);
    }

    // Monta botões das cartas
    CARTAS.forEach((carta, i) => {
      const btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = carta.nome;
      btn.onclick = () => abrirCarta(i, btn);
      choiceBtns.appendChild(btn);
    });

    // Botão Rapidinhas com contador de novas
    const totalRapidas = PENSAMENTOS.textos.length;
    const vistasAntes  = parseInt(localStorage.getItem('rapidinhas_vistas') || '0');
    const novas        = Math.max(0, totalRapidas - vistasAntes);

    const btnPens = document.createElement('button');
    btnPens.className = 'btn-rapidinhas';
    btnPens.innerHTML = '💌 Rapidinhas do Caixeiro' +
      (novas > 0 ? `<span class="badge">${novas}</span>` : '');
    btnPens.onclick = () => {
      abrirPensamentos(btnPens);
      localStorage.setItem('rapidinhas_vistas', totalRapidas);
      const badge = btnPens.querySelector('.badge');
      if (badge) badge.remove();
    };
    document.getElementById('btn-rapidinhas-wrap').appendChild(btnPens);

    function pararTudo() {
      pararIntro();
      audios.forEach(a => { a.pause(); a.currentTime = 0; });
      if (audioP) { audioP.pause(); audioP.currentTime = 0; }
      musicErro.style.display = 'none';
      letter.style.display = 'none';
      letter.classList.remove('visible');
      pensBox.style.display = 'none';
      pensBox.classList.remove('visible');
      musicBtn.style.display = 'none';
      document.querySelectorAll('.choice-btn, .btn-rapidinhas').forEach(b => b.classList.remove('active'));
    }

    function abrirCarta(index, btnEl) {
      pararTudo();
      currentIndex = index;
      currentMode  = 'carta';
      btnEl.classList.add('active');

      const carta = CARTAS[index];

      if (carta.imagem) {
        letter.innerHTML = `<img src="${carta.imagem}" alt="${carta.nome}" class="carta-img" />`;
      } else if (carta.texto) {
        letter.innerHTML = carta.texto.trim().split(/\n\s*\n/).map(p =>
          `<p>${p.trim().replace(/\n/g, '<br>')}</p>`
        ).join('');
      } else {
        letter.innerHTML = '';
      }

      letter.style.display = 'block';
      setTimeout(() => letter.classList.add('visible'), 50);

      musicBtn.style.display = 'flex';
      musicBtn.classList.add('playing');
      btnText.textContent = 'Pausar';
      audios[index].play().catch(() => {
        musicBtn.classList.remove('playing');
        btnText.textContent = 'Tocar';
      });
    }

    function abrirPensamentos(btnEl) {
      pararTudo();
      currentMode = 'pensamentos';
      btnEl.classList.add('active');
      pensIndex = 0;

      pensBox.style.display = 'flex';
      setTimeout(() => pensBox.classList.add('visible'), 50);
      atualizarPensamento(false);

      musicBtn.style.display = 'flex';
      musicBtn.classList.add('playing');
      btnText.textContent = 'Pausar';
      playlistAtual = embaralhar(PLAYLIST);
      tocarDaPlaylist(0).catch(() => {
        musicBtn.classList.remove('playing');
        btnText.textContent = 'Tocar';
      });
    }

    function atualizarPensamento(animar) {
      const total = PENSAMENTOS.textos.length;
      pensCounter.textContent = `${pensIndex + 1} / ${total}`;
      btnPrev.disabled = pensIndex === 0;
      btnNext.disabled = pensIndex === total - 1;

      const item = PENSAMENTOS.textos[pensIndex];

      const renderizar = () => {
        if (item.imagem) {
          pensImg.src = item.imagem;
          pensImg.hidden = false;
        } else {
          pensImg.removeAttribute('src');
          pensImg.hidden = true;
        }
        pensTexto.innerHTML = (item.texto || '').replace(/\n/g, '<br>');
        pensTexto.hidden = !item.texto;
        pensData.textContent = formatarData(item.data);
      };

      if (animar) {
        pensConteudo.classList.add('saindo');
        setTimeout(() => {
          renderizar();
          pensConteudo.classList.remove('saindo');
        }, 400);
      } else {
        renderizar();
      }
    }

    function navegarPensamento(dir) {
      const novo = pensIndex + dir;
      if (novo < 0 || novo >= PENSAMENTOS.textos.length) return;
      pensIndex = novo;
      atualizarPensamento(true);
      // A música continua tocando; a próxima entra só quando a atual terminar
    }

    function toggleMusic() {
      const audio = currentMode === 'pensamentos' ? audioP : (audios[currentIndex] || null);
      if (!audio) return;
      if (audio.paused) {
        audio.play().catch(() => {});
        musicBtn.classList.add('playing');
        btnText.textContent = 'Pausar';
      } else {
        audio.pause();
        musicBtn.classList.remove('playing');
        btnText.textContent = 'Tocar';
      }
    }

    // Funções chamadas pelos onclick do HTML
    Object.assign(window, { entrar, toggleMusic, navegarPensamento });
  </script>
</body>
</html>
